set -g dark-theme-black "#82A1F1"    # primary
set -g dark-theme-white "#15161D"    # on primary
set -g dark-theme-green "#3C425F"    # secondary
set -g dark-theme-blue "#AAB1D3"     # on secondary
set -g dark-theme-cyan "#E0AF68"      # accent

set -g light-theme-black "#457BE2"   # primary
set -g light-theme-white "#B4B5B9"   # on primary
set -g light-theme-green "#A9AEC9"   # secondary
set -g light-theme-blue "#6471AB"    # on secondary
set -g light-theme-cyan "#8C6C3E"     # accent

# ##################################################

set -g prompt-cursor-color "themeblack"

set -g mode-style "fg=themeblack,bg=themegreen"

set -g menu-selected-style "bg=themegreen"

set -g message-style "fg=themeblack,bg=themegreen,fill=themegreen"
set -g message-command-style "fg=themeblack,bg=themegreen"

set -g pane-border-style "fg=themegreen"
set -g pane-active-border-style "fg=themeblack"

set -g status-style "fg=themegreen,bg=terminal"

setw -g window-status-style "NONE,fg=themeblue,bg=default"
setw -g window-status-activity-style "underscore,fg=themeblack,bg=themewhite"

set -g status-left "#[fg=themewhite,bg=themeblack,bold] #S "
set -g status-right "#{prefix_highlight} #{cpu_fg_color}CPU: #{cpu_icon} #{cpu_percentage}#[fg=themegreen] | #{ram_fg_color}RAM: #{ram_icon} #{ram_percentage}"

setw -g window-status-separator "|"
setw -g window-status-format " #I #W #F "
setw -g window-status-current-format "#[fg=themeblack,bg=themegreen,bold] #I #W #F "

set -g @prefix_highlight_output_prefix "#[fg=themecyan]#[bg=default]"
set -g @prefix_highlight_output_suffix "#[fg=themegreen] |"
